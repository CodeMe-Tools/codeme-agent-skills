[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeme-agent-skills"
version = "0.1.0"
description = "Native coding agent skills, repository router, and autonomous workflows for Codeme"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Codeme Maintainers", email = "oss@codeme.io"}
]
dependencies = []

[project.scripts]
codeme-skills = "codeme_agent_skills.cli:main"
codeme-router = "codeme_agent_skills.cli:router_main"
codeme-workflow = "codeme_agent_skills.cli:workflow_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
